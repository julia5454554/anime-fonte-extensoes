name: Build SuperHentais

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/pt/superhentais/**'
      - '.github/workflows/build_superhentais.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/pt/superhentais/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Compilar a extensão SuperHentais
        run: ./gradlew :src:pt:superhentais:assembleDebug --no-daemon --stacktrace

      - name: Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find src/pt/superhentais/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK encontrado em: $APK_PATH"

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: superhentais-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload em caso de falha (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

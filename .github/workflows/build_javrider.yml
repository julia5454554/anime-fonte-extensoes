name: Build JavRider

on:
  push:
    branches: [ main ]
    paths: [ 'src/pt/javrider/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew :src:pt:javrider:assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: javrider-apk
          path: src/pt/javrider/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: javrider-v${{ github.run_number }}
          files: src/pt/javrider/build/outputs/apk/release/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build PornHub Extension

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/en/pornhub/**'
      - '.github/workflows/build_pornhub.yml'
  pull_request:
    paths:
      - 'src/en/pornhub/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/gradle-build-action@v3

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Corrigir formatação com Spotless
        run: ./gradlew :src:en:pornhub:spotlessApply --no-daemon

      - name: Compilar a extensão PornHub
        run: ./gradlew :src:en:pornhub:assembleDebug --no-daemon --stacktrace

      - name: Enviar APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: pornhub-extension-apk
          path: src/en/pornhub/build/outputs/apk/debug/*.apk

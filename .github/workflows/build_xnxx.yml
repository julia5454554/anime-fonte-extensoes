name: Build Xnxx

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/all/xnxx/**'
      - '.github/workflows/build_xnxx.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/all/xnxx/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Corrigir formatação automaticamente com Spotless
        run: ./gradlew :src:all:xnxx:spotlessApply --no-daemon

      - name: Compilar a extensão Xnxx
        run: ./gradlew :src:all:xnxx:assembleDebug --no-daemon --stacktrace

      - name: Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find src/all/xnxx/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK encontrado em: $APK_PATH"

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: xnxx-apk-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload em caso de falha (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Criar Release (apenas push em main/master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xnxx-v1.0.${{ github.run_number }}
          name: Xnxx v1.0.${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
